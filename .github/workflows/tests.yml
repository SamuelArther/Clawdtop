name: tests
on:
  push:
    branches: ['**'] # (not tags too: a release's tag push would run everything twice)
  workflow_dispatch:
concurrency: # (a newer push replaces a run still going: only the latest code gets tested)
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        shell: bash
        run: |
          javac -d build/classes src/clawdtop/*.java
          jar --create --file build/Clawdtop.jar --manifest manifest.txt -C build/classes .
          javac -d build/test-classes -cp build/classes src/clawdtop/*.java test/clawdtop/*.java
          java -Djava.awt.headless=true --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.ClawdtopTest
      - name: Start him on a real (virtual) Linux screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1280x800x24" java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.SmokeQuick shots "|2|idle" "piano|3|piano" "make disco|8|disco" "focus|2|focus"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: linux-screenshots
          path: shots

  screen:
    # the real Clawd on a real Windows desktop: his windows, menus, bubbles and big moments, with screenshots
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        shell: bash
        run: |
          javac --release 22 -Xlint:-options -d build/classes src/clawdtop/*.java
          javac -d build/test-classes -cp build/classes src/clawdtop/*.java test/clawdtop/*.java
      - name: His big moments
        shell: bash
        run: java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.Smoke shots/big
      - name: Setup, typing, games, cute stuff, dropping a song
        shell: bash
        run: |
          for t in SmokeSetup SmokeTyping SmokeGame SmokeCute SmokeDrop; do
            echo "== $t"; timeout 300 java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.$t shots/$t || echo "$t ended with $?"
          done
      - name: The desktop (grabbing a song, a zip and a picture; tidying) and his menus (click to open)
        shell: bash
        run: |
          timeout 300 java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.SmokeDesk shots/desk || echo "desk ended with $?"
          timeout 120 java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.SmokeMenus shots/menus || echo "menus ended with $?"
      - name: Everything in his menus
        shell: bash
        run: |
          timeout 400 java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.SmokeQuick shots/quick \
            "|2|idle" "settings menu|2|settings menu" "close menus|1|menus closed" "menu|2|fun menu" "close menus|1|closed again" \
            "piano|4|piano" "guitar|3|guitar" "bass|3|bass" "drums|3|drums" "lap|7|lap" "vibe|3|vibe" "timer|3|timer" \
            "stopwatch|3|stopwatch" "ttt|3|tic-tac-toe" "salute|3|salute" "christmas|5|christmas" "focus|3|focus" "remind|4|remind" \
            "checkup|4|checkup" "pet|2|petted" "ask|2|ask box" "close ask|1|ask closed"             "say stick a note: Dentist at 4|3|sticky note" "say add homework to my list|3|todo" "say keep my computer awake|4|coffee" "say let my computer sleep|2|coffee off" "say what time is it in Tokyo|3|world clock" "say find my resume|5|find file" "say take down the note|2|note down"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: shots

  screen-mac:
    # the real Clawd on a real macOS desktop (the screenshots may come out blank if macOS won't allow screen capture)
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: |
          javac --release 22 -Xlint:-options -d build/classes src/clawdtop/*.java
          javac -d build/test-classes -cp build/classes src/clawdtop/*.java test/clawdtop/*.java
      - name: Everything in his menus, on a Mac
        run: |
          java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.SmokeQuick shots/mac-quick             "|3|idle" "settings menu|2|settings menu" "close menus|1|menus closed" "menu|2|fun menu" "close menus|1|closed"             "piano|4|piano" "guitar|3|guitar" "drums|3|drums" "sing|4|singing" "cpdance|2|cp dance" "lap|8|lap" "timer|3|timer"             "watch|2|watching" "scare|0.5|scared" "salute me|2|salute" "ttt|3|tic-tac-toe" "ask|2|ask box" "close ask|1|ask closed"             "say stick a note: Dentist at 4|3|sticky note" "say add homework to my list|3|todo" "say keep my computer awake|4|coffee" "say let my computer sleep|2|coffee off" "say what time is it in Tokyo|3|world clock" "say find my resume|5|find file" "say take down the note|2|note down"
      - name: Setup, on a Mac
        run: perl -e 'alarm 300; exec @ARGV' java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.SmokeSetup shots/mac-setup || echo "setup ended with $?" # (macOS has no timeout command)
      - name: His menus, on a Mac
        run: perl -e 'alarm 120; exec @ARGV' java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.SmokeMenus shots/mac-menus || echo "menus ended with $?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: shots

  brain:
    strategy:
      fail-fast: false
      matrix:
        model: ['qwen2.5:1.5b', 'gemma3:1b', 'llama3.2:1b']
    # (it downloads a lot: only when asked for, or when a commit is about his brain)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'brain')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install his brain the way he does, and ask him things
        shell: bash
        run: |
          javac -d build/test-classes src/clawdtop/*.java test/clawdtop/*.java
          java --enable-native-access=ALL-UNNAMED -cp build/test-classes clawdtop.BrainCheck ${{ matrix.model }}
